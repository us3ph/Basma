[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basma"
version = "0.1.0"
description = "AI-generated image detector built to survive posting, resizing, colour edits and screenshots (DINOv2 views + attack training + calibrated fusion)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.48,<5",
  "huggingface-hub>=0.30,<1.0",
  "safetensors",
  "numpy",
  "pillow>=10",
  "scikit-learn",
  "joblib",
]

[project.optional-dependencies]
data = ["pyarrow", "fsspec"]
export = ["onnx", "onnxruntime"]

[tool.setuptools]
packages = ["basma"]
